name: smartwatt_flutter
description: A new Flutter project for SmartWatt - Kerala Energy Estimator.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # UI/UX & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  lucide_icons: ^0.1.2
  # State Management & Routing
  provider: ^6.1.1
  go_router: ^12.1.1
  # Backend & Network
  supabase_flutter: ^2.3.1
  http: ^1.1.2
  # Charts
  fl_chart: ^0.65.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

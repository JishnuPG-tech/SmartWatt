name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  build-android:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Setup Java (Requirement for Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Fix Tailwind Optional Dependency on Linux
        working-directory: ./Frontend
        run: npm install --no-save @tailwindcss/oxide-linux-x64-gnu

      - name: Build Next.js App
        working-directory: ./Frontend
        # This will export the static files to the 'out' directory
        run: npm run build

      - name: Setup Capacitor & Add Android
        working-directory: ./Frontend
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK (Debug)
        working-directory: ./Frontend/android
        run: |
          # Resolve Kotlin duplicate class error by aligning stdlib versions to 1.8.22
          echo "
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          " >> build.gradle
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smartwatt-android-debug-apk
          path: Frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

name: Auto Format Code

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          # Required to trigger subsequent workflows if needed, though [skip ci] prevents loops
          fetch-depth: 0

      # --- FORMAT BACKEND (PYTHON) ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Format Python code with Black and isort
        run: |
          pip install black isort
          black Backend/
          isort Backend/

      # --- FORMAT FRONTEND & MOBILE (JS/TS) ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Format JavaScript/TypeScript with Prettier
        run: |
          npm install -g prettier
          # Formats all standard web files in the Frontend and Mobile folders
          prettier --write "Frontend/**/*.{js,jsx,ts,tsx,json,css,md}" || true
          prettier --write "Mobile/**/*.{js,jsx,ts,tsx,json,css,md}" || true

      # --- COMMIT CHANGES ---
      - name: Commit and Push formatted code
        run: |
          git config --local user.email "jishnupg2005@gmail.com"
          git config --local user.name "JishnuPG-tech"
          git add .
          # The [skip ci] tag tells GitHub NOT to trigger another pipeline run from this automated commit, preventing an infinite loop!
          git commit -m "chore(ci): auto-format code [skip ci]" || exit 0
          git pull --rebase origin main || true
          git push
